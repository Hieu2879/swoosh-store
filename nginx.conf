# Cấu hình Nginx tham khảo triển khai cho Swoosh Store trên VPS Linux (Ubuntu/Debian)
# Đặt tại /etc/nginx/sites-available/swoosh-store và symlink vào /etc/nginx/sites-enabled/

# Rate limiting chống tấn công Brute-force và DDoS nhẹ
limit_req_zone $binary_remote_addr zone=swoosh_limit:10m rate=15r/s;

server {
    listen 80;
    server_name your-domain.com www.your-domain.com; # Thay bằng domain của bạn

    # Tự động chuyển hướng HTTP sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com; # Thay bằng domain của bạn

    # Chứng chỉ SSL (Cài đặt tự động bằng Certbot: sudo certbot --nginx -d your-domain.com)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Nén Gzip giúp tăng tốc tải trang
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Bảo mật Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Chặn tuyệt đối tải trực tiếp file database hoặc mã nguồn
    location ~* \.(sqlite3|db|py|pyc|env|git|md|bat|sh)$ {
        deny all;
        return 404;
    }

    location /data/ {
        deny all;
        return 404;
    }

    # Proxy toàn bộ request đến Swoosh Store Python Server (chạy ở port 8000)
    location / {
        limit_req zone=swoosh_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Truyền đúng IP thật và protocol HTTPS cho Python backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Tối ưu cache hình ảnh tĩnh
    location /images/ {
        proxy_pass http://127.0.0.1:8000/images/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
